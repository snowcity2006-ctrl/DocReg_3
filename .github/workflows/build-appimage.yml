name: Сборка Portable AppImage для Astra Linux 1.7/1.8

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-appimage:
    runs-on: ubuntu-20.04 # Используем Ubuntu 20.04 (Focal) для совместимости с glibc в Astra Linux 1.7 (Orel/Smolensk) и 1.8

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Установка системных зависимостей для сборки native-модулей (better-sqlite3)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2 icnsutils graphicsmagick

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Сборка фронтенда Vite
        run: npm run build

      - name: Сборка Electron TypeScript (Main & Preload)
        run: npm run build:electron

      - name: Пересборка better-sqlite3 под Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Сборка Portable AppImage (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --config.linux.target=AppImage --x64

      - name: Загрузка готового исполняемого файла AppImage в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-AstraLinux-Portable-AppImage
          path: dist-electron/*.AppImage
          retention-days: 30

      - name: Создание GitHub Release (при наличии Git-тега)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist-electron/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
