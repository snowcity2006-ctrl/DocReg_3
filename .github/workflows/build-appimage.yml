name: Сборка Portable версий (Linux AppImage & Windows Portable)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-appimage:
    name: Сборка AppImage (Astra Linux / Ubuntu)
    runs-on: ubuntu-22.04

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Установка системных библиотек для Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2 icnsutils graphicsmagick

      - name: Установка npm-зависимостей
        run: npm install

      - name: Сборка веб-интерфейса Vite
        run: npm run build

      - name: Сборка Electron Main & Preload
        run: npm run build:electron

      - name: Подготовка native-модулей
        run: npx @electron/rebuild -f -w better-sqlite3 || true

      - name: Сборка Portable AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --x64

      - name: Загрузка AppImage в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-Linux-Portable-AppImage
          path: release/*.AppImage
          if-no-files-found: warn
          retention-days: 30

      - name: Добавление AppImage в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-portable:
    name: Сборка Portable EXE (Windows)
    runs-on: windows-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Установка npm-зависимостей
        run: npm install

      - name: Сборка веб-интерфейса Vite
        run: npm run build

      - name: Сборка Electron Main & Preload
        run: npm run build:electron

      - name: Сборка Windows Portable EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win portable --x64

      - name: Загрузка Windows Portable в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Добавление Windows Portable в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
